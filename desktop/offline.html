<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Opal</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: radial-gradient(120% 90% at 50% -10%, #12254a, #0a1426 62%);
        color: #e8f2ff; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; -webkit-app-region: drag;
      }
      main { text-align: center; max-width: 420px; padding: 24px; }
      h1 { font-size: 26px; margin: 0 0 8px; }
      p { color: #9fb3d1; margin: 0 0 20px; }
      code { color: #bfe3ff; }
      button {
        -webkit-app-region: no-drag; font: inherit; font-weight: 600; color: #0a1d33; background: #a9dcff;
        border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung zu Opal</h1>
      <p>Der Server <code id="server"></code> antwortet gerade nicht. Prüf deine Internetverbindung und versuch es gleich noch einmal.</p>
      <button type="button" id="retry">Erneut verbinden</button>
    </main>
    <script>
      const server = new URLSearchParams(location.search).get('server') || '';
      document.getElementById('server').textContent = server;
      document.getElementById('retry').addEventListener('click', () => { if (server) location.href = server; });
    </script>
  </body>
</html>
